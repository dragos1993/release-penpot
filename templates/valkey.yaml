apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-valkey
  labels: {{ include "penpot.componentLabels" (dict "root" $ "component" "valkey") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{ include "penpot.selectorLabels" (dict "root" $ "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "penpot.selectorLabels" (dict "root" $ "component" "valkey") | nindent 8 }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.valkeyImage }}:{{ .Values.image.valkeyTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No custom args/command here: unlike the plain upstream
          # valkey/valkey image, this one has its own startup script that
          # builds the real valkey-server command line internally --
          # overriding args would bypass that script. No mandatory env
          # vars either (no password set here, matching this chart's
          # previous no-auth internal-only setup); see
          # release-penpot/README.md.
          ports:
            - containerPort: 6379
              name: valkey
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{ toYaml .Values.valkey.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-valkey
  labels: {{ include "penpot.componentLabels" (dict "root" $ "component" "valkey") | nindent 4 }}
spec:
  selector: {{ include "penpot.selectorLabels" (dict "root" $ "component" "valkey") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
      name: valkey
