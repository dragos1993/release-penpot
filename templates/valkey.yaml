apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-valkey
  labels: {{ include "penpot.componentLabels" (dict "root" $ "component" "valkey") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{ include "penpot.selectorLabels" (dict "root" $ "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "penpot.selectorLabels" (dict "root" $ "component" "valkey") | nindent 8 }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.valkeyImage }}:{{ .Values.image.valkeyTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "valkey-server"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""
          ports:
            - containerPort: 6379
              name: valkey
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{ toYaml .Values.valkey.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-valkey
  labels: {{ include "penpot.componentLabels" (dict "root" $ "component" "valkey") | nindent 4 }}
spec:
  selector: {{ include "penpot.selectorLabels" (dict "root" $ "component" "valkey") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
      name: valkey
