apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-exporter
  labels: {{ include "penpot.componentLabels" (dict "root" $ "component" "exporter") | nindent 4 }}
spec:
  replicas: {{ .Values.exporter.replicas }}
  selector:
    matchLabels: {{ include "penpot.selectorLabels" (dict "root" $ "component" "exporter") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "penpot.selectorLabels" (dict "root" $ "component" "exporter") | nindent 8 }}
    spec:
      containers:
        - name: exporter
          image: "{{ .Values.image.penpotRegistry }}/exporter:{{ .Values.image.penpotTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PENPOT_PUBLIC_URI
              value: "https://{{ .Values.publicHost }}"
            - name: PENPOT_INTERNAL_URI
              value: "http://penpot-frontend:8080"
            - name: PENPOT_REDIS_URI
              value: "redis://penpot-valkey:6379/0"
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: penpot-secret-key
          ports:
            - containerPort: 6061
              name: http
          # No documented HTTP health endpoint; probe the socket instead.
          readinessProbe:
            tcpSocket:
              port: 6061
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 6061
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{ toYaml .Values.exporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-exporter
  labels: {{ include "penpot.componentLabels" (dict "root" $ "component" "exporter") | nindent 4 }}
spec:
  selector: {{ include "penpot.selectorLabels" (dict "root" $ "component" "exporter") | nindent 4 }}
  ports:
    - port: 6061
      targetPort: 6061
      name: http
